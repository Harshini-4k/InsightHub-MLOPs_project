stages:

  validate:
    cmd: python src/data/validate_data.py
    deps:
      - data/raw/customer_data.csv
      - src/data/validate_data.py

  preprocess:
    cmd: python src/data/preprocess_data.py
    deps:
      - data/raw/customer_data.csv
      - src/data/preprocess_data.py
    outs:
      - data/processed/customer_data_processed.csv

  features:
    cmd: python src/features/feature_engineering.py
    deps:
      - data/processed/customer_data_processed.csv
      - src/features/feature_engineering.py
    outs:
      - data/processed/segmentation_data.csv

  train:
    cmd: python src/models/train_kmeans.py
    deps:
      - data/processed/segmentation_data.csv
      - src/models/train_kmeans.py
    outs:
      - models/kmeans_model.pkl
      - data/processed/customer_segments.csv

  evaluate:
    cmd: python src/models/evaluate_clusters.py
    deps:
      - data/processed/customer_segments.csv
      - src/models/evaluate_clusters.py